services:
  db:
    image: postgres:16-alpine
    container_name: furniflex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: furniflex
      POSTGRES_PASSWORD: furniflex
      POSTGRES_DB: furniflex
    ports:
      - "5432:5432"
    volumes:
      - furniflex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniflex"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: furniflex-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://furniflex:furniflex@db:5432/furniflex
      JWT_SECRET_KEY: change-this-secret-in-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  furniflex_pgdata:
